server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The container is normally published behind a TLS reverse proxy. Keep
    # these browser protections consistent with the IIS deployment.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.rakairport.com https://www.google-analytics.com https://region1.google-analytics.com https://maps.googleapis.com https://mapsresources-pa.googleapis.com https://maps.gstatic.com; frame-src https://maps.google.com https://www.google.com; upgrade-insecure-requests" always;

    # Defense in depth: PHP and implementation files must never be static assets.
    location ~* ^/assistant/ {
        return 404;
    }

    location ~* \.php$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
    }
}

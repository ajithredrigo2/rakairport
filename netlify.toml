[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Keep static-site protections equivalent to the IIS and Nginx deployments.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.rakairport.com https://www.google-analytics.com https://region1.google-analytics.com https://maps.googleapis.com https://mapsresources-pa.googleapis.com https://maps.gstatic.com; frame-src https://maps.google.com https://www.google.com; upgrade-insecure-requests"

# SPA fallback so client-side routes (/flights, /map, ...) work on refresh/deep-link
# (Netlify serves /.netlify/functions/* before redirects, so the function is unaffected.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
